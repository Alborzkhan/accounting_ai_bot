services:
  web:
    build: .
    command: ["uvicorn", "web_app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - app_data:/app/data
    restart: unless-stopped

  telegram-bot:
    build: .
    command: ["python", "bot_handlers/telegram_bot.py"]
    env_file: .env
    volumes:
      - app_data:/app/data
    restart: unless-stopped

  bale-bot:
    build: .
    command: ["python", "bot_handlers/bale_bot.py"]
    env_file: .env
    volumes:
      - app_data:/app/data
    restart: unless-stopped

volumes:
  app_data:
