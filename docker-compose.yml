services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: narin
      POSTGRES_USER: narin
      POSTGRES_PASSWORD: narin_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narin"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: ["uvicorn", "web_app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  telegram-bot:
    build: .
    command: ["python", "bot_handlers/telegram_bot.py"]
    env_file: .env
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  bale-bot:
    build: .
    command: ["python", "bot_handlers/bale_bot.py"]
    env_file: .env
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_data:
  postgres_data:
