name: Android Build (APK)

# ساخت خودکار APK اپ اندروید نارین
# خروجی را از سربرگ "Actions" این مخزن دانلود کنید.

on:
  push:
    branches: [main, master]
    paths:
      - 'android_app/**'
  workflow_dispatch:   # دکمه‌ی «Run workflow» دستی در تب Actions

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # فایل gradle-wrapper.jar باینری در مخزن نیست؛ اینجا تولیدش می‌کنیم
      - name: Generate Gradle wrapper
        working-directory: android_app
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: android_app
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: narin-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
